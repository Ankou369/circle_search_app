{% extends "campus_hub/layout.html" %}
{% block page %}
<!-- ダッシュボード (幹部用) -->
<div class="flex-1 flex flex-col bg-slate-50 fade-in">
    <div class="bg-white p-4 border-b border-slate-200">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-leader-100 flex items-center justify-center text-leader-600 font-bold">⚽️</div>
            <div>
                <h2 class="text-sm font-black">{{ leader_circle_name }}</h2>
                <p class="text-[10px] text-slate-500 font-bold">@{{ current_user.id }} ・ 管理者モード</p>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-3 mt-4 text-center">
            <div class="bg-slate-50 rounded-xl p-2 border border-slate-100"><p class="text-[10px] text-slate-500 font-bold">新規DM</p><p class="text-base font-black text-slate-800">12<span class="text-[10px] font-bold ml-0.5">件</span></p></div>
            <div class="bg-slate-50 rounded-xl p-2 border border-slate-100"><p class="text-[10px] text-slate-500 font-bold">総いいね数</p><p class="text-base font-black text-slate-800">145<span class="text-[10px] font-bold ml-0.5">件</span></p></div>
        </div>
    </div>
    <div class="flex-1 p-4 space-y-5 pb-24">
        <div>
            <h3 class="text-xs font-black mb-2">クイックアクション</h3>
            <div class="space-y-2">
                <a href="#post-form" class="w-full bg-white border border-slate-200 p-3 rounded-xl flex items-center justify-between active:scale-95 transition shadow-sm">
                    <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg bg-leader-50 text-leader-600 flex items-center justify-center"><i class="fa-solid fa-pen text-xs"></i></div><span class="text-xs font-bold">新歓情報を投稿する</span></div>
                    <i class="fa-solid fa-chevron-right text-slate-300 text-[10px]"></i>
                </a>
                <a href="/regist_circle_info/{{ current_user.id }}" class="w-full bg-white border border-slate-200 p-3 rounded-xl flex items-center justify-between active:scale-95 transition shadow-sm">
                    <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg bg-leader-50 text-leader-600 flex items-center justify-center"><i class="fa-solid fa-circle-info text-xs"></i></div><span class="text-xs font-bold">サークル情報を登録・編集する</span></div>
                    <i class="fa-solid fa-chevron-right text-slate-300 text-[10px]"></i>
                </a>
                <a href="/circle/{{ current_user.id }}" class="w-full bg-white border border-slate-200 p-3 rounded-xl flex items-center justify-between active:scale-95 transition shadow-sm">
                    <div class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg bg-leader-50 text-leader-600 flex items-center justify-center"><i class="fa-solid fa-eye text-xs"></i></div><span class="text-xs font-bold">自分のサークルページを見る</span></div>
                    <i class="fa-solid fa-chevron-right text-slate-300 text-[10px]"></i>
                </a>
            </div>
        </div>

        <form id="post-form" action="/post" method="POST" enctype="multipart/form-data" class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
            <h3 class="text-xs font-black"><i class="fa-solid fa-pen mr-1.5 text-leader-600"></i>新歓情報を投稿</h3>
            <input type="hidden" name="name" value="{{ leader_circle_name }}">
            <div>
                <label class="text-[11px] font-bold text-slate-500 ml-1">タイトル</label>
                <input type="text" name="title" placeholder="新入生歓迎会のお知らせ" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-leader-500 focus:bg-white transition">
            </div>
            <div>
                <label class="text-[11px] font-bold text-slate-500 ml-1">内容</label>
                <textarea name="comment" rows="3" placeholder="活動内容や新歓の詳細を書いてください" class="w-full mt-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm outline-none focus:border-leader-500 focus:bg-white transition" required></textarea>
            </div>
            <div>
                <label class="text-[11px] font-bold text-slate-500 ml-1">画像（任意）</label>
                <input type="file" name="image" accept="image/*" class="w-full mt-1 text-xs text-slate-500">
            </div>
            <button type="submit" class="w-full bg-slate-900 text-white font-bold text-sm py-3 rounded-xl shadow-lg active:scale-95 transition">投稿する</button>
        </form>
    </div>
</div>
{% endblock %}
