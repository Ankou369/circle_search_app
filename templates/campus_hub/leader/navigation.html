<!-- 幹部用 ボトムナビ -->

    <!-- 管理画面 -->
    <button onclick="switchScreen('leader-home')" id="tab-leader-home" class="flex flex-col items-center gap-1 text-leader-600">
        <i class="fa-solid fa-chart-pie text-lg"></i>
        <span class="text-[9px] font-bold">管理</span>
