{% extends "campus_hub/layout.html" %}
{% block page %}
<!-- 設定 (幹部用) -->
<div class="flex-1 flex flex-col bg-slate-50 fade-in">
    <div class="bg-white p-3 border-b border-slate-200 sticky top-0 z-20"><h3 class="text-sm font-bold text-center">設定</h3></div>
    <div class="flex-1 p-4 space-y-4 pb-24">
        <div class="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 text-xs font-bold text-slate-700">
            <a href="/circle/{{ current_user.id }}" class="p-3.5 flex justify-between items-center">公開プロフィールを確認 <i class="fa-solid fa-chevron-right text-slate-300 text-[10px]"></i></a>
            <a href="/regist_circle_info/{{ current_user.id }}" class="p-3.5 flex justify-between items-center">サークル情報を編集 <i class="fa-solid fa-chevron-right text-slate-300 text-[10px]"></i></a>
            <div class="p-3.5 flex justify-between items-center">メンバー管理 <i class="fa-solid fa-chevron-right text-slate-300 text-[10px]"></i></div>
        </div>
        <a href="/logout" class="w-full bg-white border border-red-200 p-3 rounded-xl flex items-center justify-center gap-2 text-red-500 active:scale-95 transition shadow-sm">
            <i class="fa-solid fa-right-from-bracket"></i><span class="text-xs font-bold">ログアウト</span>
        </a>
    </div>
</div>
{% endblock %}
