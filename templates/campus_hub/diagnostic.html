<!-- ==============================================
        2. 診断画面 (学生の新規登録時のみ表示)
=============================================== -->
<div id="screen-diagnostic" class="screen-content h-full flex flex-col bg-slate-50 hidden relative z-40">
    <div class="bg-white/90 backdrop-blur px-4 py-3 flex justify-between items-center border-b">
        <div class="w-8"></div>
        <span class="font-bold text-sm">相性診断</span>
        <button class="w-8 text-xs font-bold text-slate-400 text-right" onclick="switchScreen('student-home')">スキップ</button>
    </div>
    <div class="flex-1 p-6 flex flex-col">
        <div class="w-full h-1.5 bg-slate-200 rounded-full mb-8"><div class="h-full bg-brand-500 w-1/2 rounded-full"></div></div>
        <div class="flex-1 flex flex-col justify-center text-center fade-in">
            <div class="text-4xl mb-4">🙌</div>
            <h2 class="text-xl font-black text-slate-800 mb-2">週末の理想の過ごし方は？</h2>
            <p class="text-xs text-slate-500 mb-8">直感で選んでください</p>
            
            <div class="space-y-3">
                <button onclick="finishDiagnostic()" class="w-full p-4 bg-white border-2 border-slate-200 rounded-2xl font-bold text-slate-700 hover:border-brand-500 hover:bg-brand-50 transition text-left">
                    🎉 みんなでワイワイ遊びに行く
                </button>
                <button onclick="finishDiagnostic()" class="w-full p-4 bg-white border-2 border-slate-200 rounded-2xl font-bold text-slate-700 hover:border-brand-500 hover:bg-brand-50 transition text-left">
                    🏠 家やカフェでまったりする
                </button>
            </div>
        </div>
    </div>
</div>
