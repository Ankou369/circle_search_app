{% extends "base.html" %}
{% block content %}
<!-- 仮登録完了: 確認メール送信のお知らせ -->
<div class="min-h-screen w-full bg-white flex flex-col p-5 fade-in">
    <div class="flex-1 flex flex-col justify-center max-w-md mx-auto w-full py-8 text-center">
        <div class="w-14 h-14 bg-brand-600 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-lg shadow-brand-200"><i class="fa-regular fa-envelope"></i></div>
        <h1 class="text-lg font-black mt-4">確認メールを送信しました</h1>
        <p class="text-xs text-slate-500 mt-3 leading-relaxed font-medium">
            <span class="font-bold text-slate-700">{{ email }}</span> 宛に確認メールを送りました。<br>
            メール内のリンクを開くと登録が完了し、ログインできるようになります。<br>
            リンクの有効期限は24時間です。
        </p>
        <a href="/login" class="mt-8 w-full bg-slate-900 text-white font-bold text-sm py-3 rounded-xl shadow-lg active:scale-95 transition block">ログイン画面へ</a>
        <p class="text-[10px] text-slate-400 mt-3">メールが届かない場合は、もう一度新規登録を行うと再送されます</p>
    </div>
</div>
{% endblock %}
