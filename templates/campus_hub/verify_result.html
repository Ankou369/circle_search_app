{% extends "base.html" %}
{% block content %}
<!-- メール確認リンクのエラー表示 -->
<div class="min-h-screen w-full bg-white flex flex-col p-5 fade-in">
    <div class="flex-1 flex flex-col justify-center max-w-md mx-auto w-full py-8 text-center">
        <div class="w-14 h-14 bg-red-500 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-lg shadow-red-200"><i class="fa-solid fa-triangle-exclamation"></i></div>
        <h1 class="text-lg font-black mt-4">登録を完了できませんでした</h1>
        <p class="text-xs text-slate-500 mt-3 leading-relaxed font-medium">{{ message }}</p>
        <a href="/signup" class="mt-8 w-full bg-slate-900 text-white font-bold text-sm py-3 rounded-xl shadow-lg active:scale-95 transition block">新規登録へ</a>
    </div>
</div>
{% endblock %}
