{% extends "base.html" %}
{% block content %}
<!-- チャットトーク画面（5秒ごとに新着を自動取得） -->
<div class="h-screen w-full flex flex-col bg-slate-50 relative z-40">
    <div class="bg-slate-950/95 backdrop-blur px-4 py-3 flex justify-between items-center border-b border-slate-800 text-white">
        <a href="/chat" class="w-8 text-slate-300"><i class="fa-solid fa-chevron-left"></i></a>
        <span class="font-bold text-sm truncate">{{ partner.name }}</span>
        <div class="w-8"></div>
    </div>

    <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-2.5 max-w-md w-full mx-auto">
        {% for m in messages %}
        <div class="flex {{ 'justify-end' if m.sender_id == current_user.id else 'justify-start' }}" data-msg="{{ m.id }}">
            <div class="max-w-[75%] px-3 py-2 rounded-2xl {{ 'bg-brand-600 text-white rounded-br-md' if m.sender_id == current_user.id else 'bg-white border border-slate-200 text-slate-700 rounded-bl-md' }}">
                {% if m.body %}<p class="text-xs leading-relaxed whitespace-pre-wrap">{{ m.body }}</p>{% endif %}
                {% if m.image_path %}<img src="/uploads/{{ m.image_path }}" class="rounded-xl max-h-52 object-contain {{ 'mt-1' if m.body else '' }}">{% endif %}
                <p class="text-[8px] mt-1 text-right {{ 'text-white/70' if m.sender_id == current_user.id else 'text-slate-400' }}">{{ m.created_at[11:] }}</p>
            </div>
        </div>
        {% else %}
        <p id="chat-empty" class="text-center text-[11px] font-bold text-slate-400 py-10">まだメッセージがありません。最初の連絡を送ってみましょう</p>
        {% endfor %}
    </div>

    <form action="/chat/room/{{ room.id }}/send" method="POST" enctype="multipart/form-data" class="bg-white border-t border-slate-200 p-3">
        <div class="max-w-md mx-auto flex items-center gap-2">
            <label class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 cursor-pointer flex-shrink-0">
                <i class="fa-regular fa-image"></i>
                <input type="file" name="image" accept="image/*" class="hidden" id="chat-image-input">
            </label>
            <input type="text" name="body" placeholder="メッセージを入力" class="flex-1 bg-slate-100 border-none rounded-full px-4 py-2.5 text-xs font-medium outline-none focus:ring-2 focus:ring-brand-500">
            <button type="submit" class="w-10 h-10 rounded-full bg-brand-600 text-white flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-paper-plane text-xs"></i></button>
        </div>
        <p id="chat-image-name" class="max-w-md mx-auto text-[9px] text-slate-400 mt-1 px-1"></p>
    </form>
</div>
<script>
(function () {
    var box = document.getElementById('chat-messages');
    var lastId = 0;
    box.querySelectorAll('[data-msg]').forEach(function (el) {
        lastId = Math.max(lastId, parseInt(el.dataset.msg, 10) || 0);
    });
    function scrollBottom() { box.scrollTop = box.scrollHeight; }
    scrollBottom();

    document.getElementById('chat-image-input').addEventListener('change', function () {
        var name = this.files && this.files[0] ? this.files[0].name : '';
        document.getElementById('chat-image-name').textContent = name ? '画像: ' + name : '';
    });

    function bubble(m) {
        var row = document.createElement('div');
        row.className = 'flex ' + (m.mine ? 'justify-end' : 'justify-start');
        row.dataset.msg = m.id;
        var b = document.createElement('div');
        b.className = 'max-w-[75%] px-3 py-2 rounded-2xl ' + (m.mine
            ? 'bg-brand-600 text-white rounded-br-md'
            : 'bg-white border border-slate-200 text-slate-700 rounded-bl-md');
        if (m.body) {
            var p = document.createElement('p');
            p.className = 'text-xs leading-relaxed whitespace-pre-wrap';
            p.textContent = m.body;
            b.appendChild(p);
        }
        if (m.image_path) {
            var img = document.createElement('img');
            img.src = '/uploads/' + m.image_path;
            img.className = 'rounded-xl max-h-52 object-contain' + (m.body ? ' mt-1' : '');
            b.appendChild(img);
        }
        var t = document.createElement('p');
        t.className = 'text-[8px] mt-1 text-right ' + (m.mine ? 'text-white/70' : 'text-slate-400');
        t.textContent = (m.created_at || '').slice(11);
        b.appendChild(t);
        row.appendChild(b);
        return row;
    }

    setInterval(function () {
        fetch('/chat/room/{{ room.id }}/messages?after=' + lastId)
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (!data.messages || !data.messages.length) return;
                var empty = document.getElementById('chat-empty');
                if (empty) empty.remove();
                data.messages.forEach(function (m) {
                    lastId = Math.max(lastId, m.id);
                    box.appendChild(bubble(m));
                });
                scrollBottom();
            })
            .catch(function () {});
    }, 5000);
})();
</script>
{% endblock %}
