{% extends "base.html" %}

{% block content %}
<div class="min-h-screen w-full bg-slate-50 text-slate-800">
    <div class="max-w-md mx-auto p-4 space-y-4">
        <div class="flex items-center gap-3 pt-2">
            <a href="/circle/{{ circle_id }}" class="text-slate-400 text-sm"><i class="fa-solid fa-chevron-left"></i></a>
            <span class="font-bold text-sm">サークル情報の登録</span>
        </div>

        <form method="POST" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1">サークル・部活名</label>
                <input type="text" name="circle_name" value="{{ circle_info.circle_name if circle_info else '' }}"
                       class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1">活動時間</label>
                <input type="text" name="circle_time" value="{{ circle_info.circle_time if circle_info else '' }}" placeholder="例: 毎週火・金 18:00〜20:00"
                       class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1">活動場所</label>
                <input type="text" name="circle_place" value="{{ circle_info.circle_place if circle_info else '' }}" placeholder="例: 文教キャンパス 音楽練習室"
                       class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm">
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1">活動内容</label>
                <textarea name="activity_details" rows="4" placeholder="活動内容や雰囲気を書いてください"
                          class="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm">{{ circle_info.activity_details if circle_info else '' }}</textarea>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1">活動スケジュール（カレンダー連携用）</label>
                <div class="flex flex-wrap gap-1.5 mb-2">
                    {% for num, label in weekdays %}
                    <label class="cursor-pointer">
                        <input type="checkbox" name="weekdays" value="{{ num }}" class="peer sr-only" {% if num in selected_weekdays %}checked{% endif %}>
                        <span class="inline-block px-3 py-1.5 rounded-full border border-slate-200 bg-slate-50 text-[11px] font-bold text-slate-500 peer-checked:bg-leader-600 peer-checked:text-white peer-checked:border-leader-600">{{ label }}</span>
                    </label>
                    {% endfor %}
                </div>
                <div class="flex items-center gap-2">
                    <input type="time" name="activity_start" value="{{ circle_info.activity_start if circle_info and circle_info.activity_start else '' }}" class="flex-1 p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm">
                    <span class="text-xs font-bold text-slate-400">〜</span>
                    <input type="time" name="activity_end" value="{{ circle_info.activity_end if circle_info and circle_info.activity_end else '' }}" class="flex-1 p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm">
                </div>
                <p class="text-[10px] text-slate-400 mt-1">曜日と時刻を登録すると、フォロワーのカレンダーに活動日が表示されます</p>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-500 mb-1">学部別部員数</label>
                <div class="grid grid-cols-2 gap-2">
                    {% for col, label in faculties %}
                    <label class="flex items-center justify-between gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                        <span class="text-[11px] font-bold text-slate-600">{{ label }}</span>
                        <input type="number" name="{{ col }}" min="0" value="{{ students_row[col] if students_row else '' }}" class="w-16 p-1.5 rounded-lg bg-white border border-slate-200 text-sm text-right">
                    </label>
                    {% endfor %}
                </div>
            </div>
            <button type="submit" class="w-full bg-leader-600 text-white font-bold py-3 rounded-xl text-sm">登録する</button>
        </form>
    </div>
</div>
{% endblock %}
