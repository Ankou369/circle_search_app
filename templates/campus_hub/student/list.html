{% extends "campus_hub/layout.html" %}
{% block page %}
<!-- サークル一覧（DB連動・検索で絞り込み） -->
<div class="flex-1 flex flex-col bg-slate-50 fade-in">
    <div class="bg-white p-3 border-b border-slate-200 sticky top-0 z-20">
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input id="circle-search-input" type="text" placeholder="サークル名・活動内容で検索" class="w-full bg-slate-100 border-none rounded-full pl-9 pr-4 py-2 text-xs font-medium outline-none focus:ring-2 focus:ring-brand-500 transition">
        </div>
    </div>
    <div class="flex-1 p-3 space-y-2 pb-24">
        {% if circles %}
            {% for circle in circles %}
            <a href="/circle/{{ circle.circle_id }}" class="circle-card bg-white p-3 rounded-xl border border-slate-200 flex gap-3 items-center shadow-sm" data-name="{{ (circle.circle_name or circle.circle_id)|lower }}">
                <div class="w-12 h-12 rounded-lg bg-slate-100 flex items-center justify-center text-xl flex-shrink-0">🎓</div>
                <div class="flex-1 min-w-0">
                    <h5 class="text-xs font-bold truncate">{{ circle.circle_name or circle.circle_id }}</h5>
                    <p class="text-[10px] text-slate-500 truncate">@{{ circle.circle_id }}</p>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-300 text-[10px]"></i>
            </a>
            {% endfor %}
            <p id="circle-search-empty" class="hidden text-center text-xs font-bold text-slate-400 py-10">条件に合うサークルが見つかりませんでした</p>
        {% else %}
            <p class="text-center text-xs font-bold text-slate-400 py-10">登録されているサークルはまだありません</p>
        {% endif %}
    </div>
</div>
{% endblock %}
