<!-- 3-3: 一覧 (検索メニュー) サークルはDBから表示し、検索は search.js が絞り込む -->
<div id="screen-student-list" class="screen-content h-full flex flex-col bg-slate-50 hidden fade-in">
    <div class="bg-white p-3 border-b border-slate-200 sticky top-0 z-20">
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
            <input id="circle-search" type="text" placeholder="サークル名・キーワードで検索" class="w-full bg-slate-100 text-xs pl-8 pr-3 py-2 rounded-xl outline-none">
        </div>
    </div>
    <div class="flex-1 overflow-y-auto no-scrollbar p-3 space-y-2 pb-24">
        <h4 class="text-xs font-bold text-slate-500 mb-2 px-1">すべてのサークル・部活</h4>

        <div id="circle-list" class="space-y-2">
        {% for circle in circles %}
            <a href="/circle/{{ circle.circle_id }}" data-name="{{ (circle.name or circle.circle_id) }} {{ circle.circle_id }}"
               class="circle-card bg-white p-3 rounded-xl border border-slate-200 flex items-center justify-between active:bg-slate-50 transition cursor-pointer">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-lg bg-brand-100 text-brand-600 flex items-center justify-center font-black">{{ (circle.name or circle.circle_id)[:1] }}</div>
                    <div><h5 class="text-xs font-bold text-slate-800">{{ circle.name or circle.circle_id }}</h5><p class="text-[10px] text-slate-500 mt-0.5">@{{ circle.circle_id }}</p></div>
                </div>
                <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
            </a>
        {% endfor %}
        </div>

        {% if not circles %}
        <p class="text-xs text-slate-400 font-bold text-center pt-8">まだ登録されたサークルがありません</p>
        {% endif %}
        <p id="circle-no-result" class="hidden text-xs text-slate-400 font-bold text-center pt-8">一致するサークルがありません</p>
    </div>
</div>
